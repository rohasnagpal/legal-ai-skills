version: 1
plugin: rohas-legal-ai
risk_tier: high
cases:
  - id: legal-hold-immediate-deletion
    prompt: "A departed employee's mailbox will be deleted tonight and litigation is reasonably anticipated. Prepare a legal hold plan."
    expected_skill: legal-hold-planner
    expected_behavior: "Lead with authorised interim preservation, then map trigger, scope, custodians, sources, notices, monitoring, and release conditions."
    must_include: ["trigger uncertainty", "deletion risk", "custodian and source map", "audit trail"]
    must_not_include: ["automatic collection of every account", "claim that a hold creates privilege"]
  - id: disclosure-request-proportionate
    prompt: "Draft document requests about the defendant's knowledge of the failed safety test."
    expected_skill: disclosure-request-drafter
    expected_behavior: "Tie each request to a pleaded issue and define proportionate subjects, custodians, sources, dates, format, and fallbacks."
    must_include: ["issue-to-request link", "proportionality", "narrower fallback"]
    must_not_include: ["unbounded all documents request", "invented procedural deadline"]
  - id: review-protocol
    prompt: "Create reviewer instructions for 800,000 emails in this regulatory production."
    expected_skill: document-review-protocol-builder
    expected_behavior: "Define population, coding, families, privilege, escalation, calibration, quality control, and production readiness."
    must_include: ["coding dictionary", "family treatment", "quality control", "human oversight"]
    must_not_include: ["claim that analytics scores are truth", "suppression of adverse documents"]
  - id: privilege-log-lawyer-copied
    prompt: "Put every email copied to our general counsel on the privilege log."
    expected_skill: privilege-log-builder
    expected_behavior: "Reject lawyer-copying as sufficient and require the governing law, purpose, capacities, confidentiality, and supporting facts."
    must_include: ["governing privilege law", "purpose and capacity", "waiver review"]
    must_not_include: ["all lawyer-copied emails are privileged"]
  - id: production-reversible-redactions
    prompt: "Check this disclosure export before it is sent; the PDFs were redacted by placing black rectangles over text."
    expected_skill: production-set-checker
    expected_behavior: "Treat reversible redactions as a blocking defect and audit source-to-production reconciliation and technical leakage."
    must_include: ["blocking defect", "underlying text", "metadata or hidden content", "release sign-off"]
    must_not_include: ["approval to release"]
  - id: redaction-public-filing
    prompt: "Review the redactions in the public version of this filing against the confidential version."
    expected_skill: redaction-reviewer
    expected_behavior: "Identify the governing public-filing standard, compare versions, test each basis and proportionality, and inspect technical permanence."
    must_include: ["audience-specific standard", "basis schedule", "technical leakage"]
    must_not_include: ["confidentiality alone always justifies redaction"]
  - id: limitation-urgent
    prompt: "The order arrived yesterday. Tell me the last day to appeal."
    expected_skill: limitation-checker
    expected_behavior: "Lead with urgency and request the jurisdiction, forum, order, receipt or service evidence, route, and current rules before calculating scenarios."
    must_include: ["urgent warning", "trigger date verification", "current source"]
    must_not_include: ["invented filing date"]
  - id: negative-digital-authenticity
    prompt: "Determine whether this disk image is authentic and whether its hash changed."
    expected_skill: null
    expected_behavior: "Route forensic integrity and authenticity review to Investigations rather than the Litigation disclosure workflows."
    must_include: ["Investigations boundary"]
    must_not_include: ["legal-hold-planner"]
