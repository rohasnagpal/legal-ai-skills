# Matter record. Kept in the conversation by default. Write it to
# matters/<matter_id>/matter.yaml only when the user asks to keep a matter file.
matter_id: MAT-YYYY-NNN
saved_at: ""              # ISO 8601 timestamp with offset; only after an actual save
objective: ""
next_action: { task: "", owner: "", due: "" }
client_decisions: []
facts: []                  # - { statement: "", source: "", status: user-supplied | documented | allegation | assumption }
conclusions: []            # - { id: C1, text: "", as_of: "", inputs: [], status: current | revised | withdrawn | cannot-reassess, supersedes: "", reason: "" }
changes: []                # - { baseline: "", new_input: "", affected_conclusions: [], action: "" }
title: ""
represented_party: ""
client_role: ""            # e.g. buyer, employee, accused, tenant, creditor
opposing_parties: []
jurisdiction:
  country: ""
  state: ""                # State, province or sub-national unit where material
  forum: ""
size: standard             # quick | standard | complex
matter_owner: ""           # e.g. real-estate-lawyer
workflow: ""               # workflow file name, or none
workflow_branch: ""
counsel: []                # e.g. [india-counsel]
conflict_check: pending    # pending | clear | issue-found | not-run (say why)
key_dates: []              # - { event: "", date: "", source: "" }
# Use matter-continuity.md. Arithmetic success does not verify the premises.
deadlines: []
# - id: DL1
#   item: ""
#   kind: legal              # legal | contractual | client
#   trigger: { event: "", date: "", source: "" }
#   rule: { text: "", source: "" }
#   calculation: { period: "", trigger_day: "", day_type: "", holidays: [], timezone: "", cutoff: "", inputs: {}, result: "" }
#   date: ""
#   responsible_person: ""  # unknown until established
#   verified: false
#   verified_at: ""
#   verified_by: ""
#   missing_inputs: []
#   supersedes: ""
#   change_reason: ""
documents: []              # - { name: "", version: "", path: "", status: read | partially-read | unreadable | awaiting-OCR | not-reviewed, reviewed_locations: [], gap: "", effect: "", next_step: "" }
missing_documents: []      # - { name: "", why_needed: "", affected_tasks: [] }
tasks: []                  # - { id: T1, owner: "", task: "", status: open | done | returned }
delegation_requests: []    # see assets/firm/lawyer-operating-model.md
outputs: []
open_issues: []
review: pending            # pending | returned | approved
human_review_required: []  # decisions or actions needing a qualified lawyer or the client
