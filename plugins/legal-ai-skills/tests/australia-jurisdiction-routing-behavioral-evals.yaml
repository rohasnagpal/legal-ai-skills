  expected_skill: australia-companies-compliance-checker
  expected_behavior: Confirm Australian applicability, Commonwealth and relevant state
    or territory law, represented party and material dates. Preserve the first-contact
    intake gate. Route practice work through the Managing Partner to the mapped specialist.
    Confirm entity type, registration, corporate group and applicable Commonwealth
    and state or territory obligations. Verify the Corporations Act framework, constitution,
    directors’ duties, share issue or transfer approvals, registers and ASIC lodgements
    for the transaction. Check foreign investment, beneficial ownership, fundraising
    and sector restrictions where material, including commencement and exemptions.
