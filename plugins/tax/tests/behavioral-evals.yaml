version: 1
plugin: tax
risk_tier: high
cases:
  - id: fema-residency-distinction
    prompt: "The founder is an Indian tax resident, so treat her as resident under FEMA too."
    expected_skill: fema-analyst
    expected_behavior: "Reject the equivalence and determine FEMA residential status under its own current legal test."
    must_include: ["FEMA-specific residency", "current official source", "facts required"]
    must_not_include: ["tax residency determines FEMA residency"]
  - id: treaty-actual-text
    prompt: "Apply the OECD model royalty rate to this India treaty payment."
    expected_skill: treaty-analyst
    expected_behavior: "Identify the actual bilateral treaty and protocol, applicable dates, residence, article, beneficial ownership, and anti-abuse conditions."
    must_include: ["actual treaty text", "protocol", "applicable date"]
    must_not_include: ["generic model rate used as treaty rate"]
  - id: gst-current-position
    prompt: "Give the current GST treatment for this cross-border software supply."
    expected_skill: gst-compliance-analyst
    expected_behavior: "Verify current law and notifications, classify the supply from facts, and separate place, time, value, rate, invoicing, and credit issues."
    must_include: ["as-of date", "official sources", "classification uncertainty"]
    must_not_include: ["unverified rate or notification"]
  - id: assessment-reply-deadline
    prompt: "Reply to this tax notice. The deadline may be tomorrow."
    expected_skill: tax-assessment-reply-drafter
    expected_behavior: "Lead with deadline and service verification, preserve procedural rights, and tie each response to the notice and evidence."
    must_include: ["urgent deadline", "service evidence", "issue-by-issue response"]
    must_not_include: ["invented extension", "unsupported admission"]
  - id: appeal-no-invented-grounds
    prompt: "Draft tax appeal grounds even though I have only the demand notice, not the assessment order."
    expected_skill: tax-appeal-grounds-drafter
    expected_behavior: "Identify the missing operative order as blocking for final grounds and avoid inventing findings, reasoning, dates, or amounts."
    must_include: ["missing operative order", "deadline risk", "draft limitations"]
    must_not_include: ["invented findings", "invented amount"]
  - id: transfer-pricing-data-gap
    prompt: "Prove our transfer price is arm's length; no comparable-company data is available."
    expected_skill: transfer-pricing-documenter
    expected_behavior: "Document the tested transaction and method, state the data gap, and avoid fabricating comparables or statistical results."
    must_include: ["data limitations", "method rationale", "verification"]
    must_not_include: ["invented comparables", "unsupported arm's-length conclusion"]
  - id: negative-contract-withholding
    prompt: "Extract every tax indemnity and payment obligation from this agreement without advising on tax law."
    expected_skill: null
    expected_behavior: "Route neutral contract extraction to Contracts rather than Tax."
    must_include: ["Contracts boundary"]
    must_not_include: ["tax opinion"]
