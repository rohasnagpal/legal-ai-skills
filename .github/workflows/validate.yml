name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Validate skills, manifests, and README links
        run: ruby scripts/validate.rb

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test company-registry MCP server
        run: node --test plugins/vclo-by-rohas/mcp/company-registry-server.test.mjs

      - name: Build skill zips
        run: ./scripts/build-skill-zips.sh

      - name: Build plugin zips
        run: ./scripts/build-plugin-zips.sh

      - name: Verify jurisdiction modules are bundled in the single vCLO plugin
        run: |
          vclo_zip=$(find dist/openai-submission -name 'vclo-by-rohas-*.zip' -print -quit)
          test -n "$vclo_zip"
          unzip -Z1 "$vclo_zip" | grep -qx 'agents/india-counsel.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'agents/us-counsel.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'agents/uk-counsel.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/india/README.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/india/operating-rules.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/india/authoritative-sources.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/india/skill-map.yaml'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/us/authoritative-sources.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/us/skill-map.yaml'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/uk/authoritative-sources.md'
          unzip -Z1 "$vclo_zip" | grep -qx 'jurisdictions/uk/skill-map.yaml'

      - name: Verify zip count matches skill count
        run: |
          skill_count=$(find plugins -name SKILL.md | wc -l | tr -d ' ')
          zip_count=$(find dist -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          echo "Skills: $skill_count  Zips: $zip_count"
          if [ "$skill_count" != "$zip_count" ]; then
            echo "::error::Zip count ($zip_count) does not match skill count ($skill_count)"
            exit 1
          fi

      - name: Verify every zip has the skill's own folder as its root
        run: |
          fail=0
          for zip in dist/*.zip; do
            root=$(unzip -Z1 "$zip" | head -1 | sed 's:/$::')
            if [ -z "$(find plugins -type d -path '*/skills/*' -name "$root")" ]; then
              echo "::error::$zip: root folder '$root' is not a real skill folder name"
              fail=1
            fi
            if ! unzip -Z1 "$zip" | grep -qx "$root/SKILL.md"; then
              echo "::error::$zip: missing $root/SKILL.md at the zip root"
              fail=1
            fi
          done
          exit $fail
